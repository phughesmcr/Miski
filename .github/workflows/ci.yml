name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 1.0.0-alpha

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7

      - name: Run CI validation
        run: deno task ci

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - name: Set up browser smoke tooling
        run: |
          mkdir -p "$RUNNER_TEMP/miski-browser"
          npm install --prefix "$RUNNER_TEMP/miski-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/miski-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "MISKI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/miski-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Run consumer smoke checks
        run: deno task smoke:consumers
