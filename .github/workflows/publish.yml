name: Publish
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify tag matches deno.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match deno.json version $VERSION"
            exit 1
          fi

      - name: Run CI checks
        run: deno task ci

      - name: Lint generated documentation
        run: deno doc --lint mod.ts

      - name: Verify JSR package
        run: deno publish --dry-run

      - name: Publish package
        run: deno publish
