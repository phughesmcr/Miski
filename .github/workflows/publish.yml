name: Publish

on:
  push:
    tags:
      - "v*"

# No permissions by default; each job declares only what it needs.
permissions: {}

jobs:
  # Runs all validation and third-party tooling (npm, Bun, Playwright) WITHOUT
  # an OIDC token. Nothing installed here can mint a publish credential.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      # Full history so the master-ancestry check below can see origin/master.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7

      - name: Verify tag matches deno.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match deno.json version $VERSION"
            exit 1
          fi

      # Stable releases must come from master. Pre-releases (version contains a
      # hyphen, e.g. 1.0.0-alpha.4) may be tagged from any branch.
      - name: Require stable releases to be reachable from master
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-*)
              echo "Pre-release $VERSION: master ancestry not required."
              ;;
            *)
              if ! git rev-parse --verify --quiet refs/remotes/origin/master >/dev/null; then
                echo "origin/master not found; cannot verify stable release ancestry."
                exit 1
              fi
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
                echo "Stable release $VERSION must be tagged on a commit merged to master."
                exit 1
              fi
              ;;
          esac

      - name: Run CI checks
        run: deno task ci

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - name: Set up browser smoke tooling
        run: |
          mkdir -p "$RUNNER_TEMP/miski-browser"
          npm install --prefix "$RUNNER_TEMP/miski-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/miski-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "MISKI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/miski-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Run consumer smoke checks
        run: deno task smoke:consumers

  # The only job with id-token: write. It installs nothing beyond Deno itself.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7

      - name: Re-verify tag matches deno.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match deno.json version $VERSION"
            exit 1
          fi

      - name: Verify JSR package
        run: deno publish --dry-run

      - name: Publish package
        run: deno publish
