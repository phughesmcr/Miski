name: Consumer smoke checks
description: >-
  Install the Node, Bun and Playwright toolchain and run the consumer smoke
  checks (clean npm/Bun installs, consumer types, browser bundle). Expects the
  repository to be checked out and Deno to be set up. Shared by ci.yml and
  publish.yml so the tool version pins live in one place.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.0

    - name: Set up browser smoke tooling
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/miski-browser"
        npm install --prefix "$RUNNER_TEMP/miski-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
        node "$RUNNER_TEMP/miski-browser/node_modules/playwright/cli.js" install --with-deps chromium
        echo "MISKI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/miski-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"

    - name: Run consumer smoke checks
      shell: bash
      run: deno task smoke:consumers
